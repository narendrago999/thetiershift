name: AI Data Factory backend checks

on:
  push:
    branches: [main, feat/ai-data-factory-foundation]
    paths:
      - "ai-data-factory/backend/**"
      - "ai-data-factory/frontend/**"
      - ".github/workflows/ai-data-factory-backend.yml"
  pull_request:
    paths:
      - "ai-data-factory/backend/**"
      - "ai-data-factory/frontend/**"
      - ".github/workflows/ai-data-factory-backend.yml"

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-data-factory/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-data-factory/backend/requirements.txt
      - name: Install application dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile backend and migration modules
        run: python -m compileall -q app migrations
      - name: Run backend unit tests
        run: pytest -q
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Check frontend JavaScript syntax
        run: node --check ../frontend/config.js && node --check ../frontend/js/app.js && node --check ../frontend/js/auth-client.js
