name: Engineering Studio quality checks

on:
  pull_request:
    paths:
      - "studio/**"
      - "architecture/**"
      - "contact/**"
      - "intelligence/**"
      - "insights/**"
      - "services/**"
      - "sitemap.xml"
      - ".github/workflows/studio-quality.yml"
      - ".github/workflows/studio-live-smoke.yml"
      - "assets/js/site-navigation.js"
      - "assets/js/tier-analytics.js"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "studio/**"
      - "architecture/**"
      - "contact/**"
      - "intelligence/**"
      - "insights/**"
      - "services/**"
      - "assets/js/tier-analytics.js"
      - "sitemap.xml"
      - "assets/js/site-navigation.js"
      - ".github/workflows/studio-quality.yml"

permissions:
  contents: read

jobs:
  studio-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check studio/studio.js
          node --check intelligence/intelligence.js
          node --check assets/js/site-navigation.js
          node --check assets/js/tier-analytics.js
      - name: Run static Studio QA
        run: python3 studio/qa-check.py
