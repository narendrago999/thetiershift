services:
  - type: web
    name: tiershift-data-factory-api
    runtime: python
    plan: free
    region: singapore
    rootDir: ai-data-factory/backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        value: https://thetiershift.com/ai-data-factory/
      - key: CORS_ORIGINS
        value: https://thetiershift.com
      - key: INTERNAL_EMAIL_DOMAINS
        value: thetiershift.com
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: INVITATION_TOKEN_TTL_HOURS
        value: "168"
