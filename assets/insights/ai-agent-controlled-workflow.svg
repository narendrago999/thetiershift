<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">A controlled AI agent workflow</title><desc id="desc">A request is interpreted, planned, checked against policy, executed with approved tools, validated and either completed or escalated for human approval.</desc><defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5575f7"/><stop offset="1" stop-color="#16b8a6"/></linearGradient></defs><rect width="1200" height="380" rx="24" fill="#f4f7ff"/><g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="30" y="110" width="160" height="140" rx="18" fill="#fff" stroke="#b9c8f5" stroke-width="2"/><circle cx="110" cy="150" r="24" fill="#e3eaff"/><path d="M98 150h24M110 138v24" stroke="#4264df" stroke-width="4" stroke-linecap="round"/><text x="110" y="202" font-size="21" font-weight="700" fill="#17233b">Request</text><text x="110" y="228" font-size="15" fill="#63728b">User goal</text></g><g><rect x="245" y="110" width="160" height="140" rx="18" fill="#fff" stroke="#b9c8f5" stroke-width="2"/><circle cx="325" cy="150" r="24" fill="#e3eaff"/><path d="M313 143h24M313 151h24M313 159h15" stroke="#4264df" stroke-width="3" stroke-linecap="round"/><text x="325" y="202" font-size="21" font-weight="700" fill="#17233b">Plan</text><text x="325" y="228" font-size="15" fill="#63728b">Break into steps</text></g><g><rect x="460" y="110" width="160" height="140" rx="18" fill="#fff" stroke="#7bcfc4" stroke-width="2"/><circle cx="540" cy="150" r="24" fill="#dff8f3"/><path d="M529 150l8 8 15-17" fill="none" stroke="#159b8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="202" font-size="21" font-weight="700" fill="#17233b">Policy check</text><text x="540" y="228" font-size="15" fill="#63728b">Permissions &amp; limits</text></g><g><rect x="675" y="110" width="160" height="140" rx="18" fill="#fff" stroke="#b9c8f5" stroke-width="2"/><circle cx="755" cy="150" r="24" fill="#e3eaff"/><path d="M744 159l11-20 11 20z" fill="none" stroke="#4264df" stroke-width="3"/><text x="755" y="202" font-size="21" font-weight="700" fill="#17233b">Act</text><text x="755" y="228" font-size="15" fill="#63728b">Approved tools</text></g><g><rect x="890" y="110" width="160" height="140" rx="18" fill="#fff" stroke="#7bcfc4" stroke-width="2"/><circle cx="970" cy="150" r="24" fill="#dff8f3"/><path d="M958 150l8 8 16-18" fill="none" stroke="#159b8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="970" y="202" font-size="21" font-weight="700" fill="#17233b">Validate</text><text x="970" y="228" font-size="15" fill="#63728b">Check the result</text></g><g><rect x="1080" y="110" width="100" height="140" rx="18" fill="#14294f"/><text x="1130" y="167" font-size="18" font-weight="700" fill="#fff">Done</text><text x="1130" y="194" font-size="14" fill="#c9d8f4">or</text><text x="1130" y="218" font-size="14" fill="#7de0d3">escalate</text></g><g stroke="url(#line)" stroke-width="5" fill="none" stroke-linecap="round"><path d="M190 180h45m-12-12 12 12-12 12M405 180h55m-12-12 12 12-12 12M620 180h55m-12-12 12 12-12 12M835 180h55m-12-12 12 12-12 12M1050 180h30m-12-12 12 12-12 12"/></g><rect x="380" y="292" width="440" height="54" rx="14" fill="#e0f7f3" stroke="#8dd9cf"/><text x="600" y="326" font-size="18" font-weight="700" fill="#176e66">Human approval for sensitive or high-impact actions</text><path d="M755 250v42" stroke="#16a596" stroke-width="3" stroke-dasharray="6 6"/></g></svg>