<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Data contracts connect producers, governed pipelines and trusted consumers</title><desc id="d">A visual flow showing source teams publishing a contract, a validation gate checking schema quality freshness and ownership, and trusted analytics and AI consumers.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1530"/><stop offset="1" stop-color="#14294a"/></linearGradient><linearGradient id="blue"><stop stop-color="#4777ff"/><stop offset="1" stop-color="#28c4d8"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="16"/></filter></defs><rect width="1200" height="620" rx="28" fill="url(#bg)"/><circle cx="600" cy="300" r="210" fill="#2c72ff" opacity=".12" filter="url(#glow)"/><g font-family="Inter,Arial,sans-serif" fill="#fff"><text x="60" y="66" font-size="16" font-weight="700" letter-spacing="3" fill="#71d9ee">TIERSHIFT / DATA ENGINEERING</text><text x="60" y="118" font-size="34" font-weight="800">Make the data agreement explicit.</text><text x="60" y="151" font-size="17" fill="#b9c8df">A contract sits between what producers promise and what consumers rely on.</text><g transform="translate(65 230)"><rect width="250" height="220" rx="20" fill="#1a2c4b" stroke="#49658e"/><rect x="22" y="22" width="48" height="48" rx="12" fill="#294c82"/><path d="M36 47h20M46 37v20" stroke="#9edcff" stroke-width="3" stroke-linecap="round"/><text x="22" y="104" font-size="20" font-weight="700">Producer team</text><text x="22" y="137" font-size="15" fill="#c4d2e6">Publishes data with</text><text x="22" y="160" font-size="15" fill="#c4d2e6">clear meaning and rules.</text><text x="22" y="195" font-size="12" fill="#70d6eb" font-weight="700">SOURCE SYSTEMS</text></g><path d="M330 340h92" stroke="#64cde5" stroke-width="4" stroke-linecap="round"/><path d="m410 328 14 12-14 12" fill="none" stroke="#64cde5" stroke-width="4" stroke-linecap="round"/><g transform="translate(435 205)"><rect width="330" height="270" rx="22" fill="#192f54" stroke="#5c82c5" stroke-width="2"/><rect x="24" y="24" width="54" height="54" rx="14" fill="url(#blue)"/><path d="M42 52l9 9 18-22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="116" font-size="23" font-weight="800">Data contract</text><text x="24" y="148" font-size="14" fill="#b9c8df">A versioned, testable agreement</text><g font-size="14" font-weight="600"><rect x="24" y="174" width="132" height="32" rx="9" fill="#24436e"/><text x="38" y="195">Schema</text><rect x="170" y="174" width="136" height="32" rx="9" fill="#24436e"/><text x="184" y="195">Quality</text><rect x="24" y="218" width="132" height="32" rx="9" fill="#24436e"/><text x="38" y="239">Freshness</text><rect x="170" y="218" width="136" height="32" rx="9" fill="#24436e"/><text x="184" y="239">Ownership</text></g></g><path d="M780 340h92" stroke="#64cde5" stroke-width="4" stroke-linecap="round"/><path d="m860 328 14 12-14 12" fill="none" stroke="#64cde5" stroke-width="4" stroke-linecap="round"/><g transform="translate(885 230)"><rect width="250" height="220" rx="20" fill="#1a2c4b" stroke="#49658e"/><rect x="22" y="22" width="48" height="48" rx="12" fill="#214f5b"/><path d="M34 54h24M34 44h24M34 34h16" stroke="#8ff0d4" stroke-width="3" stroke-linecap="round"/><text x="22" y="104" font-size="20" font-weight="700">Consumers</text><text x="22" y="137" font-size="15" fill="#c4d2e6">Analytics, applications</text><text x="22" y="160" font-size="15" fill="#c4d2e6">and AI use trusted data.</text><text x="22" y="195" font-size="12" fill="#8ce7ce" font-weight="700">DOWNSTREAM TEAMS</text></g><text x="60" y="545" font-size="14" fill="#aabbd3">When a change breaks the agreement, tests and alerts make the impact visible before trust is lost.</text><text x="60" y="582" font-size="12" fill="#71d9ee" font-weight="700" letter-spacing="2">ENGINEERING THE NEXT SHIFT.</text></g></svg>