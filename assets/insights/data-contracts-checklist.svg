<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Five building blocks of a practical data contract</title><desc id="d">Schema, business meaning, quality and freshness, ownership, and change management.</desc><rect width="1200" height="430" rx="24" fill="#0d1933"/><g font-family="Inter,Arial,sans-serif"><text x="52" y="62" font-size="16" font-weight="700" letter-spacing="3" fill="#70d8ec">THE CONTRACT CHECKLIST</text><text x="52" y="108" font-size="30" font-weight="800" fill="#fff">Five things worth agreeing up front</text><g transform="translate(52 150)"><g><rect width="205" height="210" rx="18" fill="#172b4c" stroke="#42618b"/><circle cx="34" cy="38" r="19" fill="#3c6ce2"/><text x="34" y="44" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">1</text><text x="22" y="91" font-size="19" font-weight="700" fill="#fff">Schema</text><text x="22" y="124" font-size="14" fill="#c4d2e6">Fields, types, keys</text><text x="22" y="147" font-size="14" fill="#c4d2e6">and compatibility.</text></g><g transform="translate(220)"><rect width="205" height="210" rx="18" fill="#172b4c" stroke="#42618b"/><circle cx="34" cy="38" r="19" fill="#3c6ce2"/><text x="34" y="44" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">2</text><text x="22" y="91" font-size="19" font-weight="700" fill="#fff">Meaning</text><text x="22" y="124" font-size="14" fill="#c4d2e6">Definitions, grain</text><text x="22" y="147" font-size="14" fill="#c4d2e6">and valid values.</text></g><g transform="translate(440)"><rect width="205" height="210" rx="18" fill="#172b4c" stroke="#42618b"/><circle cx="34" cy="38" r="19" fill="#1d9fba"/><text x="34" y="44" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">3</text><text x="22" y="91" font-size="19" font-weight="700" fill="#fff">Quality</text><text x="22" y="124" font-size="14" fill="#c4d2e6">Nulls, uniqueness</text><text x="22" y="147" font-size="14" fill="#c4d2e6">and freshness.</text></g><g transform="translate(660)"><rect width="205" height="210" rx="18" fill="#172b4c" stroke="#42618b"/><circle cx="34" cy="38" r="19" fill="#1d9fba"/><text x="34" y="44" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">4</text><text x="22" y="91" font-size="19" font-weight="700" fill="#fff">Ownership</text><text x="22" y="124" font-size="14" fill="#c4d2e6">Contacts, support</text><text x="22" y="147" font-size="14" fill="#c4d2e6">and escalation.</text></g><g transform="translate(880)"><rect width="205" height="210" rx="18" fill="#172b4c" stroke="#42618b"/><circle cx="34" cy="38" r="19" fill="#e58c45"/><text x="34" y="44" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">5</text><text x="22" y="91" font-size="19" font-weight="700" fill="#fff">Change</text><text x="22" y="124" font-size="14" fill="#c4d2e6">Versioning, notice</text><text x="22" y="147" font-size="14" fill="#c4d2e6">and deprecation.</text></g></g></g></svg>