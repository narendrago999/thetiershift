<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">FinOps for Data Platforms: Control Cloud Costs Without Slowing Engineering</title><desc id="desc">Data platform FinOps architecture showing ingestion, compute, storage and analytics costs flowing into a cost allocation and optimization control plane.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1830"/><stop offset="1" stop-color="#142b50"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4d78ff"/><stop offset="1" stop-color="#22c6dc"/></linearGradient></defs><rect width="1200" height="520" rx="28" fill="url(#bg)"/><text x="64" y="66" fill="#8ea9d8" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">TIERSHIFT TECHNOLOGIES · ENGINEERING BLUEPRINT</text><text x="64" y="118" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Make every workload's cost explainable</text><rect x="65" y="165" width="235" height="110" rx="16" fill="#172e51" stroke="#4b6a9b" stroke-width="2"/><rect x="65" y="165" width="235" height="7" rx="4" fill="url(#blue)"/><text x="83" y="207" fill="#ffffff" font-family="Arial,sans-serif" font-size="21" font-weight="700">INGESTION</text><text x="83" y="238" fill="#b7c8e4" font-family="Arial,sans-serif" font-size="14">Sources · movement · orchestration</text><rect x="350" y="165" width="235" height="110" rx="16" fill="#172e51" stroke="#4b6a9b" stroke-width="2"/><rect x="350" y="165" width="235" height="7" rx="4" fill="url(#blue)"/><text x="368" y="207" fill="#ffffff" font-family="Arial,sans-serif" font-size="21" font-weight="700">COMPUTE</text><text x="368" y="238" fill="#b7c8e4" font-family="Arial,sans-serif" font-size="14">Spark · SQL · transformations</text><rect x="635" y="165" width="235" height="110" rx="16" fill="#172e51" stroke="#4b6a9b" stroke-