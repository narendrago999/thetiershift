<svg viewBox="0 0 960 330" role="img" aria-labelledby="quality-title quality-desc" xmlns="http://www.w3.org/2000/svg"><title id="quality-title">Data quality controls for trustworthy AI</title><desc id="quality-desc">Source data passes through validation, standardisation and lineage checks before retrieval or model use, followed by grounded AI outputs and continuous monitoring.</desc><defs><linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b32"/><stop offset="1" stop-color="#203b61"/></linearGradient><marker id="qarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#83d9ce" stroke-width="1.5"/></marker></defs><rect width="960" height="330" rx="22" fill="url(#qbg)"/><text x="34" y="38" fill="#8fe0d4" font-size="12" font-weight="700" letter-spacing="2">TRUST PIPELINE</text><g font-family="Arial,sans-serif"><g stroke="#47648f" fill="#243d62"><rect x="35" y="100" width="150" height="92" rx="13"/><rect x="220" y="100" width="150" height="92" rx="13"/><rect x="405" y="100" width="150" height="92" rx="13"/><rect x="590" y="100" width="150" height="92" rx="13"/><rect x="775" y="100" width="150" height="92" rx="13"/></g><g fill="#fff" font-size="15" font-weight="700" text-anchor="middle"><text x="110" y="137">Source data</text><text x="295" y="137">Validate</text><text x="480" y="137">Enrich &amp; trace</text><text x="665" y="137">Ground AI</text><text x="850" y="137">Useful output</text></g><g fill="#b9c9e5" font-size="11" text-anchor="middle"><text x="110" y="160">Systems · files</text><text x="295" y="160">Rules · thresholds</text><text x="480" y="160">Context · lineage</text><text x="665" y="160">Relevant evidence</text><text x="850" y="160">Cited · reviewed</text></g><g stroke="#83d9ce" stroke-width="2" fill="none" marker-end="url(#qarr)"><path d="M185 146H214"/><path d="M370 146H399"/><path d="M555 146H584"/><path d="M740 146H769"/></g><rect x="220" y="235" width="520" height="52" rx="11" fill="#173e4c" stroke="#2e8f87"/><text x="480" y="256" fill="#a5f1e6" font-size="13" font-weight="700" text-anchor="middle">CONTINUOUS QUALITY MONITORING</text><text x="480" y="274" fill="#b9dcd8" font-size="11" text-anchor="middle">Freshness · drift · access · feedback · human escalation</text><path d="M850 198V260H746" fill="none" stroke="#83d9ce" stroke-width="1.5" stroke-dasharray="5 5"/></g></svg>