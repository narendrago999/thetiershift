<svg viewBox="0 0 960 340" role="img" aria-labelledby="lake-title lake-desc" xmlns="http://www.w3.org/2000/svg"><title id="lake-title">Modern lakehouse architecture flow</title><desc id="lake-desc">Source systems flow through ingestion into bronze, silver and gold data layers, then into analytics and AI consumers, with governance and observability across the platform.</desc><defs><linearGradient id="lakebg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b32"/><stop offset="1" stop-color="#1d3760"/></linearGradient><marker id="lakearr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#86a2ff" stroke-width="1.4"/></marker></defs><rect width="960" height="340" rx="22" fill="url(#lakebg)"/><text x="34" y="38" fill="#8fe0d4" font-size="12" font-weight="700" letter-spacing="2">REFERENCE ARCHITECTURE</text><g font-family="Arial,sans-serif"><g fill="#243b60" stroke="#506b9c"><rect x="30" y="105" width="130" height="92" rx="12"/><rect x="190" y="105" width="130" height="92" rx="12"/><rect x="350" y="105" width="130" height="92" rx="12"/><rect x="510" y="105" width="130" height="92" rx="12"/><rect x="690" y="70" width="230" height="62" rx="12"/><rect x="690" y="168" width="230" height="62" rx="12"/></g><g fill="#fff" font-size="16" font-weight="700" text-anchor="middle"><text x="95" y="143">Sources</text><text x="255" y="143">Ingestion</text><text x="415" y="143">Bronze</text><text x="575" y="143">Silver → Gold</text><text x="805" y="107">BI &amp; reporting</text><text x="805" y="205">AI &amp; data products</text></g><g fill="#b9c9e5" font-size="11" text-anchor="middle"><text x="95" y="165">ERP · CRM · APIs</text><text x="255" y="165">Batch · CDC · events</text><text x="415" y="165">Raw &amp; replayable</text><text x="575" y="165">Validated &amp; curated</text><text x="805" y="124">Trusted metrics</text><text x="805" y="222">Governed access</text></g><g stroke="#86a2ff" stroke-width="2" fill="none" marker-end="url(#lakearr)"><path d="M160 151H184"/><path d="M320 151H344"/><path d="M480 151H504"/><path d="M640 130H665V101H684"/><path d="M640 174H665V199H684"/></g><rect x="190" y="260" width="730" height="46" rx="10" fill="#173e4c" stroke="#2e8f87"/><text x="555" y="288" fill="#a5f1e6" font-size="13" text-anchor="middle" font-weight="700">CROSS-CUTTING CONTROLS · GOVERNANCE · LINEAGE · QUALITY · OBSERVABILITY</text></g></svg>