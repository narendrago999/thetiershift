<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">Data contracts make reliable data possible</title><desc id="d">TierShift branded infographic explaining five parts of a data contract.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1530"/><stop offset="1" stop-color="#18355b"/></linearGradient><linearGradient id="a"><stop stop-color="#4777ff"/><stop offset="1" stop-color="#27c4d8"/></linearGradient></defs><rect width="1080" height="1080" rx="36" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="72" y="88" font-size="22" font-weight="700" letter-spacing="4" fill="#70d8ec">TIERSHIFT TECHNOLOGIES</text><text x="72" y="205" font-size="66" font-weight="800" fill="#fff">Your pipeline is</text><text x="72" y="282" font-size="66" font-weight="800" fill="#fff">green. Is your data</text><text x="72" y="359" font-size="66" font-weight="800" fill="#70d8ec">actually reliable?</text><text x="74" y="414" font-size="25" fill="#c5d4e9">Data contracts turn assumptions into testable agreements.</text><g transform="translate(72 490)"><g><rect width="438" height="142" rx="20" fill="#1b3154" stroke="#5477a9"/><circle cx="62" cy="70" r="30" fill="url(#a)"/><text x="62" y="79" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">01</text><text x="116" y="62" font-size="29" font-weight="700" fill="#fff">Schema</text><text x="116" y="99" font-size="20" fill="#c5d4e9">Fields, types, keys</text></g><g transform="translate(462)"><rect width="438" height="142" rx="20" fill="#1b3154" stroke="#5477a9"/><circle cx="62" cy="70" r="30" fill="url(#a)"/><text x="62" y="79" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">02</text><text x="116" y="62" font-size="29" font-weight="700" fill="#fff">Business meaning</text><text x="116" y="99" font-size="20" fill="#c5d4e9">Definitions and grain</text></g><g transform="translate(0 166)"><rect width="438" height="142" rx="20" fill="#1b3154" stroke="#5477a9"/><circle cx="62" cy="70" r="30" fill="#1d9fba"/><text x="62" y="79" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">03</text><text x="116" y="62" font-size="29" font-weight="700" fill="#fff">Quality &amp; freshness</text><text x="116" y="99" font-size="20" fill="#c5d4e9">Rules and delivery cadence</text></g><g transform="translate(462 166)"><rect width="438" height="142" rx="20" fill="#1b3154" stroke="#5477a9"/><circle cx="62" cy="70" r="30" fill="#1d9fba"/><text x="62" y="79" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">04</text><text x="116" y="62" font-size="29" font-weight="700" fill="#fff">Ownership</text><text x="116" y="99" font-size="20" fill="#c5d4e9">Contacts and escalation</text></g><g transform="translate(0 332)"><rect width="900" height="142" rx="20" fill="#1b3154" stroke="#5477a9"/><circle cx="62" cy="70" r="30" fill="#df8c48"/><text x="62" y="79" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">05</text><text x="116" y="62" font-size="29" font-weight="700" fill="#fff">Change management</text><text x="116" y="99" font-size="20" fill="#c5d4e9">Versioning, notice and safe evolution</text></g></g><text x="72" y="1030" font-size="20" font-weight="700" letter-spacing="3" fill="#70d8ec">ENGINEERING THE NEXT SHIFT.</text></g></svg>